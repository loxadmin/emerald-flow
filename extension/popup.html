<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karbali</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #1E293B;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      color: #10B981;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .points-badge {
      background: #1E293B;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #10B981;
      font-weight: 600;
    }
    .content { padding: 16px; }

    /* Auth screen */
    .auth-screen { text-align: center; padding: 32px 16px; }
    .auth-screen h2 { margin-bottom: 8px; font-size: 16px; }
    .auth-screen p { color: #94A3B8; font-size: 13px; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost {
      background: transparent;
      color: #94A3B8;
      font-size: 12px;
      margin-top: 12px;
    }

    /* Offer card */
    .offer-card {
      background: #1E293B;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }
    .offer-card.has-offer {
      border-color: #10B981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
    }
    .offer-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .offer-points {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 24px;
      font-weight: 700;
      color: #10B981;
      margin-bottom: 4px;
    }
    .offer-naira {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 12px;
    }
    .offer-events {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .event-tag {
      background: #0F172A;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-claim {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-claim:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-claim:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* No offer */
    .no-offer {
      text-align: center;
      padding: 24px 0;
      color: #64748B;
    }
    .no-offer-icon { font-size: 32px; margin-bottom: 8px; }
    .no-offer p { font-size: 13px; }

    /* Status */
    .status {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      border-radius: 6px;
      margin-top: 12px;
    }
    .status.success { background: #064E3B; color: #6EE7B7; }
    .status.error { background: #7F1D1D; color: #FCA5A5; }

    /* Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #1E293B;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      color: #64748B;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-link:hover { color: #94A3B8; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>

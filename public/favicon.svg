<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Karbali animated logo">
  <title>Karbali animated logo</title>
  <defs>
    <radialGradient id="kbGlow" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#14c78b"/>
      <stop offset="45%" stop-color="#0ea472"/>
      <stop offset="100%" stop-color="#043c29"/>
    </radialGradient>
    <radialGradient id="kbDot" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </radialGradient>
  </defs>
  <!-- Emerald disc -->
  <circle cx="32" cy="32" r="31" fill="url(#kbGlow)"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#043c29" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- White orbit ring -->
  <circle cx="35" cy="36" r="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="2.6">
    <animate attributeName="stroke-opacity" values="0.78;0.95;0.78" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Highlight dot orbiting the ring -->
  <g>
    <circle cx="35" cy="22.5" r="6.6" fill="url(#kbDot)">
      <animate attributeName="r" values="6.6;7.4;6.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" from="-45 35 36" to="315 35 36" dur="16s" repeatCount="indefinite"/>
  </g>
</svg>
